<body>

  <main id="content">

    <div class="res-wrapper">

      <h1 class="res-titolo">Restituzione</h1>

      <!-- ─── Ricerca libro per etichetta ─────────────────────── -->

        <div class="res-scheda__intestazione">

          <button class="res-scheda__chiudi" id="btn-chiudi-scheda" aria-label="Chiudi scheda">✕</button>
        </div>
        <h2 class="res-scheda__titolo"  id="scheda-titolo"></h2>
        <p  class="res-scheda__autore"  id="scheda-autore"></p>

        <dl class="res-scheda__dettagli">

            <dd class="res-scheda__dd" id="scheda-utente"></dd>

          <div class="res-scheda__riga">
            <dt class="res-scheda__dt">Dal</dt>
            <dd class="res-scheda__dd" id="scheda-data"></dd>
          </div>
          <div class="res-scheda__riga">
            <dt class="res-scheda__dt">Tipo</dt>
            <dd class="res-scheda__dd" id="scheda-tipo"></dd>
          </div>
        </dl>

        <div class="res-note">
          <label class="res-label" for="campo-note">

          <textarea

            class="res-textarea"

  <style>
    /* ─── Restituzione — layout ───────────────────────────────── */
    .res-wrapper {
      max-width: 800px;

    }

      font-weight: 700;

    }

    .res-sezione__desc {
      font-size: var(--text-sm);
      color: var(--color-text-muted);

    }

    .res-scheda__etichetta {
      font-size: var(--text-xs);

      color: var(--color-text-muted);
      text-transform: uppercase;

    }

    .res-scheda__chiudi {
      background: none;
      border: none;
      font-size: var(--text-base);

      cursor: pointer;
      padding: 2px var(--space-xs);

    .res-note {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
      margin-bottom: var(--space-lg);
    }

    .res-label {
      font-size: var(--text-sm);
      font-weight: 600;
      color: var(--color-text-secondary);
    }

    .res-label__opz {
      font-weight: 400;
      color: var(--color-text-muted);
    }

    .res-input,
    .res-textarea {
      padding: var(--space-xs) var(--space-sm);
      font-family: var(--font-ui);
      font-size: var(--text-base);
      color: var(--color-text-primary);

      border: 1px solid var(--color-border);

      min-height: 64px;

      align-items: center;
      gap: var(--space-md);

      display: inline-flex;
      align-items: center;

      font-weight: 600;
      border-radius: var(--radius-md);
      border: none;
      cursor: pointer;
      transition: background 0.15s;
      outline: none;
    }

    .res-btn:focus-visible {
      box-shadow: var(--shadow-focus);
    }

    .res-btn--primario {
      background: var(--color-action-success);
      color: var(--color-text-on-brand);
    }

    .res-btn--primario:hover {
      background: var(--color-action-success-hover);
    }

    .res-btn--primario:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .res-feedback {
      font-size: var(--text-sm);
      font-weight: 600;

    .res-feedback--ok {

    .res-feedback--errore {
      color: var(--color-action-danger);
    }
  </style>

  <?!= include('script') ?>

  <script>
  /* ═══════════════════════════════════════════════════════════════════
     restituzione.html — JavaScript lato client
  ════════════════════════════════════════════════════════════════════ */

  (function () {
    'use strict';

    /* ─── Riferimenti DOM ─────────────────────────────────────── */
    var campoEtichetta    = document.getElementById('campo-etichetta');
    var listaSuggerimenti = document.getElementById('lista-suggerimenti');
    var schedaLibro       = document.getElementById('scheda-libro');
    var btnChiudiScheda   = document.getElementById('btn-chiudi-scheda');
    var campoNote         = document.getElementById('campo-note');
    var btnRestituito     = document.getElementById('btn-restituito');
    var feedback          = document.getElementById('res-feedback');

    var indiceAttivo     = -1;
    var libroSelezionato = null;

    /* ─── Utilità ─────────────────────────────────────────────── */
    function escHTML(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function evidenzia(testo, query) {
      if (!query) return escHTML(testo);
      var re = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      return escHTML(testo).replace(re, '<em class="autocomplete__em">$1</em>');
    }

    function formattaData(valore) {
      if (!valore) return '—';
      var d = new Date(valore);
      if (isNaN(d.getTime())) return String(valore);
      return d.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }

    function formattaTipo(tipo) {
      var mappa = { breve: 'Prestito breve', standard: 'Prestito standard', lungo: 'Prestito lungo' };
      return mappa[tipo] || tipo || '—';
    }

    /* ─── Filtra libri in prestito ────────────────────────────── */
    function filtra(query) {
      var q = query.trim().toLowerCase();
      if (!q) return [];
      var risultati = [];
      for (var i = 0; i < LIBRI_IN_PRESTITO.length; i++) {
        var libro = LIBRI_IN_PRESTITO[i];
        if (libro.etichetta.toLowerCase().indexOf(q) !== -1 ||
            libro.titolo.toLowerCase().indexOf(q) !== -1) {
          risultati.push(libro);
          if (risultati.length >= 30) break;
        }
      }
      return risultati;
    }

    /* ─── Renderizza tendina ──────────────────────────────────── */
    function renderTendina(risultati, query) {
      listaSuggerimenti.innerHTML = '';
      indiceAttivo = -1;

      if (risultati.length === 0) {
        nascondiTendina();
        return;
      }

      var frammento = document.createDocumentFragment();
      for (var i = 0; i < risultati.length; i++) {
        (function (libro) {
          var li = document.createElement('li');
          li.className = 'autocomplete__voce';
          li.setAttribute('role', 'option');
          li.setAttribute('aria-selected', 'false');

          li.innerHTML =
            '<span class="autocomplete__voce-etichetta">' + evidenzia(libro.etichetta, query) + '</span>' +
            '<span class="autocomplete__voce-titolo">'    + escHTML(libro.titolo) + '</span>' +
            '<span class="autocomplete__voce-utente">'    + escHTML(libro.utente) + '</span>';

          li.addEventListener('mousedown', function (ev) {
            ev.preventDefault();
            selezionaLibro(libro);
          });

          frammento.appendChild(li);
        })(LIBRI_IN_PRESTITO[i]);
      }

      listaSuggerimenti.appendChild(frammento);
      mostraTendina();
    }

    function mostraTendina() {
      listaSuggerimenti.classList.add('autocomplete__lista--visibile');
      campoEtichetta.setAttribute('aria-expanded', 'true');
    }

    function nascondiTendina() {
      listaSuggerimenti.classList.remove('autocomplete__lista--visibile');
      campoEtichetta.setAttribute('aria-expanded', 'false');
      indiceAttivo = -1;
    }

    function aggiornaVoceAttiva(nuovoIndice) {
      var voci = listaSuggerimenti.querySelectorAll('.autocomplete__voce');
      if (voci[indiceAttivo]) {
        voci[indiceAttivo].classList.remove('autocomplete__voce--attiva');
        voci[indiceAttivo].setAttribute('aria-selected', 'false');
      }
      indiceAttivo = nuovoIndice;
      if (voci[indiceAttivo]) {
        voci[indiceAttivo].classList.add('autocomplete__voce--attiva');
        voci[indiceAttivo].setAttribute('aria-selected', 'true');
        voci[indiceAttivo].scrollIntoView({ block: 'nearest' });
      }
    }

    /* ─── Seleziona libro ─────────────────────────────────────── */
    function selezionaLibro(libro) {
      libroSelezionato = libro;
      campoEtichetta.value = libro.etichetta;
      nascondiTendina();

      /* Popola scheda */
      document.getElementById('scheda-etichetta-label').textContent =
        'Etichetta: ' + libro.etichetta;
      document.getElementById('scheda-titolo').textContent =
        libro.titolo + (libro.volume ? ' — vol. ' + libro.volume : '');
      document.getElementById('scheda-autore').textContent =
        libro.autore + (libro.coautore ? ' / ' + libro.coautore : '');
      document.getElementById('scheda-utente').textContent = libro.utente || '—';
      document.getElementById('scheda-data').textContent   = formattaData(libro.dataPrestito);
      document.getElementById('scheda-tipo').textContent   = formattaTipo(libro.tipo);

      /* Note precompilate */
      campoNote.value = libro.note || '';

      /* Mostra scheda */
      schedaLibro.classList.remove('res-scheda--nascosta');
      feedback.textContent = '';
      feedback.className   = 'res-feedback';
    }

    /* ─── Reset ───────────────────────────────────────────────── */
    function reset() {
      libroSelezionato     = null;
      campoEtichetta.value = '';
      schedaLibro.classList.add('res-scheda--nascosta');
      feedback.textContent = '';
      feedback.className   = 'res-feedback';
      campoEtichetta.focus();
    }

    btnChiudiScheda.addEventListener('click', reset);

    /* ─── Event listener campo ricerca ───────────────────────── */
    campoEtichetta.addEventListener('input', function () {
      var query = campoEtichetta.value;
      if (query.trim().length === 0) {
        nascondiTendina();
        return;
      }
      renderTendina(filtra(query), query.trim());
    });

    campoEtichetta.addEventListener('keydown', function (ev) {
      var voci = listaSuggerimenti.querySelectorAll('.autocomplete__voce');
      var visibile = listaSuggerimenti.classList.contains('autocomplete__lista--visibile');
      if (!visibile) return;

      if (ev.key === 'ArrowDown') {
        ev.preventDefault();
        aggiornaVoceAttiva(Math.min(indiceAttivo + 1, voci.length - 1));
      } else if (ev.key === 'ArrowUp') {
        ev.preventDefault();
        aggiornaVoceAttiva(Math.max(indiceAttivo - 1, 0));
      } else if (ev.key === 'Enter') {
        ev.preventDefault();
        if (indiceAttivo >= 0 && voci[indiceAttivo]) {
          voci[indiceAttivo].dispatchEvent(new MouseEvent('mousedown'));
        }
      } else if (ev.key === 'Escape') {
        nascondiTendina();
      }
    });

    campoEtichetta.addEventListener('blur', function () {
      setTimeout(nascondiTendina, 150);
    });

    /* ─── Registra restituzione ───────────────────────────────── */
    btnRestituito.addEventListener('click', function () {
      if (!libroSelezionato) return;

      btnRestituito.disabled = true;
      feedback.className     = 'res-feedback';
      feedback.textContent   = 'Registrazione in corso…';

      google.script.run
        .withSuccessHandler(function (risultato) {
          btnRestituito.disabled = false;
          if (risultato.ok) {
            feedback.className   = 'res-feedback res-feedback--ok';
            feedback.textContent = '✓ Restituzione registrata.';

            /* Rimuove il libro dall'array locale */
            LIBRI_IN_PRESTITO = LIBRI_IN_PRESTITO.filter(function (l) {
              return l.etichetta !== libroSelezionato.etichetta;
            });

            setTimeout(reset, 1800);
          } else {
            feedback.className   = 'res-feedback res-feedback--errore';
            feedback.textContent = risultato.errore || 'Errore durante la registrazione.';
          }
        })
        .withFailureHandler(function () {
          btnRestituito.disabled = false;
          feedback.className     = 'res-feedback res-feedback--errore';
          feedback.textContent   = 'Errore di comunicazione con il server.';
        })
        .registraRestituzione({
          etichetta: libroSelezionato.etichetta,
          note:      campoNote.value.trim()
        });
    });

  })();
  </script>

</body>
