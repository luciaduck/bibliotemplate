<?!= include('head') ?>

<body>

  <?!= include('header') ?>

  <main id="content">

    <div class="res-wrapper">

      <h1 class="res-titolo">Restituzione</h1>
      <p class="res-desc">
        Elenco dei libri attualmente in prestito, ordinati per etichetta.
        Trova il libro, controlla i dati e premi “Restituito”.
      </p>

      <!-- ─── Barra filtro ─────────────────────────────────────── -->
      <div class="res-barra">
        <input
          type="text"
          id="campo-filtro"
          class="res-input res-filtro"
          placeholder="Filtra per etichetta o titolo…"
          autocomplete="off"
          aria-label="Filtra i libri in prestito"
        />
        <span class="res-contatore" id="res-contatore" aria-live="polite"></span>
      </div>

      <!-- ─── Lista libri in prestito ──────────────────────────── -->
      <div id="lista-restituzione" class="res-lista"></div>

    </div> <!-- fine res-wrapper -->

  </main>

  <?!= include('footer') ?>

  <!-- Dati iniettati server-side (stessa funzione di Utenti) -->
  <script>
    var LIBRI_IN_PRESTITO = <?!= JSON.stringify(datiRestituzione) ?>;
  </script>

  <style>
    /* ─── Restituzione — layout ───────────────────────────────── */
    .res-wrapper {
      max-width: 800px;
      margin: 0 auto;
    }

    .res-titolo {
      font-size: var(--text-xl);
      font-weight: 700;
      color: var(--color-text-primary);
      margin-bottom: var(--space-xs);
    }

    .res-desc {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      margin-bottom: var(--space-lg);
      line-height: 1.6;
    }

    /* ─── Barra filtro ────────────────────────────────────────── */
    .res-barra {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-md);
      margin-bottom: var(--space-md);
      flex-wrap: wrap;
    }

    .res-input {
      padding: var(--space-xs) var(--space-sm);
      font-family: var(--font-ui);
      font-size: var(--text-base);
      color: var(--color-text-primary);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .res-filtro {
      max-width: 320px;
      width: 100%;
    }

    .res-input:focus,
    .res-textarea:focus {
      border-color: var(--color-border-focus);
      box-shadow: var(--shadow-focus);
    }

    .res-contatore {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      white-space: nowrap;
    }

    /* ─── Messaggio vuoto ─────────────────────────────────────── */
    .res-vuoto {
      text-align: center;
      padding: var(--space-xl);
      color: var(--color-text-muted);
      font-size: var(--text-sm);
    }

    /* ─── Card libro ──────────────────────────────────────────── */
    .res-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-left: 4px solid var(--color-action-warning);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      padding: var(--space-lg);
      margin-bottom: var(--space-md);
    }

    .res-card__intestazione {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--space-sm);
      margin-bottom: var(--space-xs);
    }

    .res-card__etichetta {
      font-size: var(--text-xs);
      font-weight: 700;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .res-card__utente {
      font-size: var(--text-sm);
      font-weight: 700;
      color: var(--color-brand);
      font-family: monospace;
      letter-spacing: 0.04em;
    }

    .res-card__titolo {
      font-size: var(--text-lg);
      font-weight: 700;
      color: var(--color-text-primary);
      margin-bottom: 2px;
    }

    .res-card__autore {
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
      margin-bottom: var(--space-md);
    }

    .res-card__dettagli {
      display: grid;
      gap: var(--space-xs);
      margin-bottom: var(--space-md);
    }

    .res-card__riga {
      display: flex;
      gap: var(--space-sm);
      font-size: var(--text-sm);
    }

    .res-card__dt {
      color: var(--color-text-muted);
      min-width: 100px;
      flex-shrink: 0;
    }

    .res-card__dd {
      color: var(--color-text-primary);
      font-weight: 600;
    }

    /* ─── Note ────────────────────────────────────────────────── */
    .res-note {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
      margin-bottom: var(--space-md);
    }

    .res-label {
      font-size: var(--text-sm);
      font-weight: 600;
      color: var(--color-text-secondary);
    }

    .res-label__opz {
      font-weight: 400;
      color: var(--color-text-muted);
    }

    .res-textarea {
      padding: var(--space-xs) var(--space-sm);
      font-family: var(--font-ui);
      font-size: var(--text-base);
      color: var(--color-text-primary);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      width: 100%;
      resize: vertical;
      min-height: 56px;
    }

    /* ─── Azioni ──────────────────────────────────────────────── */
    .res-azioni {
      display: flex;
      align-items: center;
      gap: var(--space-md);
    }

    .res-btn {
      display: inline-flex;
      align-items: center;
      padding: var(--space-xs) var(--space-lg);
      font-family: var(--font-ui);
      font-size: var(--text-sm);
      font-weight: 600;
      border-radius: var(--radius-md);
      border: none;
      cursor: pointer;
      transition: background 0.15s;
      outline: none;
    }

    .res-btn:focus-visible {
      box-shadow: var(--shadow-focus);
    }

    .res-btn--primario {
      background: var(--color-action-success);
      color: var(--color-text-on-brand);
    }

    .res-btn--primario:hover {
      background: var(--color-action-success-hover);
    }

    .res-btn--primario:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .res-feedback {
      font-size: var(--text-sm);
      font-weight: 600;
    }

    .res-feedback--ok {
      color: var(--color-action-success);
    }

    .res-feedback--errore {
      color: var(--color-action-danger);
    }

    @media (max-width: 600px) {
      .res-card__dt {
        min-width: 80px;
      }
    }
  </style>

  <?!= include('script') ?>

  <script>
  /* ═══════════════════════════════════════════════════════════════════
     restituzione.html — JavaScript lato client
     Elenco completo dei libri in prestito (modello “Utenti”), con filtro,
     note modificabili e restituzione per riga. Nessun autocomplete.
  ════════════════════════════════════════════════════════════════════ */

  (function () {
    'use strict';

    /* ─── Riferimenti DOM ─────────────────────────────────────── */
    var campoFiltro = document.getElementById('campo-filtro');
    var lista       = document.getElementById('lista-restituzione');
    var contatore   = document.getElementById('res-contatore');

    /* ─── Utilità ─────────────────────────────────────────────── */
    function escHTML(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formattaData(valore) {
      if (!valore) return '—';
      var d = new Date(valore);
      if (isNaN(d.getTime())) return String(valore);
      return d.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }

    function formattaTipo(tipo) {
      var mappa = { breve: 'Prestito breve', standard: 'Prestito standard', lungo: 'Prestito lungo' };
      return mappa[tipo] || tipo || '—';
    }

    /* ─── Ordina per etichetta (alfanumerico naturale) ────────── */
    function ordina(arr) {
      return arr.slice().sort(function (a, b) {
        return String(a.etichetta).localeCompare(
          String(b.etichetta), 'it', { numeric: true, sensitivity: 'base' }
        );
      });
    }

    /* ─── Filtra per etichetta o titolo ───────────────────────── */
    function filtra(query) {
      var q = query.trim().toLowerCase();
      if (!q) return LIBRI_IN_PRESTITO.slice();
      return LIBRI_IN_PRESTITO.filter(function (l) {
        return l.etichetta.toLowerCase().indexOf(q) !== -1 ||
               l.titolo.toLowerCase().indexOf(q) !== -1;
      });
    }

    /* ─── Contatore (totale in prestito, indipendente dal filtro) ── */
    function aggiornaContatore() {
      var n = LIBRI_IN_PRESTITO.length;
      contatore.textContent = n + (n === 1 ? ' libro in prestito' : ' libri in prestito');
    }

    /* ─── Crea una card per un libro ──────────────────────────── */
    function creaCard(libro) {
      var card = document.createElement('div');
      card.className = 'res-card';

      var titolo = libro.titolo + (libro.volume ? ' — vol. ' + libro.volume : '');
      var autore = (libro.autore || '') + (libro.coautore ? ' / ' + libro.coautore : '');

      card.innerHTML =
        '<div class="res-card__intestazione">' +
          '<span class="res-card__etichetta">' + escHTML(libro.etichetta) + '</span>' +
          '<span class="res-card__utente">' + escHTML(libro.utente || '—') + '</span>' +
        '</div>' +
        '<h2 class="res-card__titolo">' + escHTML(titolo) + '</h2>' +
        '<p class="res-card__autore">' + escHTML(autore) + '</p>' +
        '<dl class="res-card__dettagli">' +
          '<div class="res-card__riga">' +
            '<dt class="res-card__dt">Dal</dt>' +
            '<dd class="res-card__dd">' + escHTML(formattaData(libro.dataPrestito)) + '</dd>' +
          '</div>' +
          '<div class="res-card__riga">' +
            '<dt class="res-card__dt">Tipo</dt>' +
            '<dd class="res-card__dd">' + escHTML(formattaTipo(libro.tipo)) + '</dd>' +
          '</div>' +
        '</dl>' +
        '<div class="res-note">' +
          '<label class="res-label">Note <span class="res-label__opz">(opzionali — modificabili)</span></label>' +
          '<textarea class="res-textarea" rows="2" aria-label="Note"></textarea>' +
        '</div>' +
        '<div class="res-azioni">' +
          '<button class="res-btn res-btn--primario" type="button">✓ Restituito</button>' +
          '<span class="res-feedback" aria-live="polite"></span>' +
        '</div>';

      var textarea = card.querySelector('.res-textarea');
      var btn      = card.querySelector('.res-btn');
      var feedback = card.querySelector('.res-feedback');

      textarea.value = libro.note || '';

      /* ─── Restituzione di questo libro ──────────────────────── */
      btn.addEventListener('click', function () {
        btn.disabled        = true;
        feedback.className   = 'res-feedback';
        feedback.textContent = 'Registrazione in corso…';

        google.script.run
          .withSuccessHandler(function (risultato) {
            if (risultato && risultato.ok) {
              feedback.className   = 'res-feedback res-feedback--ok';
              feedback.textContent = '✓ Restituito';

              /* Rimuove il libro dall'array locale e poi dalla pagina */
              LIBRI_IN_PRESTITO = LIBRI_IN_PRESTITO.filter(function (l) {
                return l.etichetta !== libro.etichetta;
              });
              aggiornaContatore();

              setTimeout(function () {
                if (card.parentNode) card.parentNode.removeChild(card);
                /* Se non resta nessuna card visibile, mostra il messaggio adatto */
                if (!lista.querySelector('.res-card')) render(campoFiltro.value);
              }, 1200);

            } else {
              btn.disabled         = false;
              feedback.className    = 'res-feedback res-feedback--errore';
              feedback.textContent  = (risultato && risultato.errore) || 'Errore durante la registrazione.';
            }
          })
          .withFailureHandler(function () {
            btn.disabled         = false;
            feedback.className    = 'res-feedback res-feedback--errore';
            feedback.textContent  = 'Errore di comunicazione con il server.';
          })
          .registraRestituzione({
            etichetta: libro.etichetta,
            note:      textarea.value.trim()
          });
      });

      return card;
    }

    /* ─── Renderizza la lista (filtrata e ordinata) ───────────── */
    function render(query) {
      lista.innerHTML = '';

      var risultati = ordina(filtra(query));

      if (risultati.length === 0) {
        lista.innerHTML =
          '<p class="res-vuoto">' +
          (query && query.trim()
            ? 'Nessun libro corrisponde alla ricerca.'
            : 'Nessun libro attualmente in prestito.') +
          '</p>';
        return;
      }

      var frammento = document.createDocumentFragment();
      for (var i = 0; i < risultati.length; i++) {
        frammento.appendChild(creaCard(risultati[i]));
      }
      lista.appendChild(frammento);
    }

    /* ─── Event listener filtro ───────────────────────────────── */
    campoFiltro.addEventListener('input', function () {
      render(campoFiltro.value);
    });

    /* ─── Avvio ───────────────────────────────────────────────── */
    aggiornaContatore();
    render('');

  })();
  </script>

</body>
